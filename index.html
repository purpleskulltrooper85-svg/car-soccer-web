<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12376f" />
  <title>Car Soccer</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="manifest" href="site.webmanifest" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0e14; }
    #app { height: 100%; }
    #boot-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #0b0e14; color: #dfe6f3; z-index: 9999;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .4s ease; pointer-events: none;
    }
    #boot-splash.hide { opacity: 0; }
    #boot-splash .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.15); border-top-color: #4f8ef7;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    #boot-splash.error { pointer-events: auto; }
    #boot-splash.error .spinner { display: none; }
    #boot-splash .msg { max-width: 640px; text-align: center; line-height: 1.5; font-size: 14px; padding: 0 16px; }
    #boot-splash.error .msg { color: #ff9d9d; white-space: pre-line; }
  </style>
  <script>
  /* ============================================================================
   * Car Soccer - single-file web port loader
   *
   * The original bundle resolves assets with origin-rooted paths like
   * "/assets/..." and spawns a module worker via `new URL(..., import.meta.url)`,
   * so it can only load from car-soccer.com itself. This loader makes it run
   * from anywhere by:
   *   1. rewriting every asset URL (fetch / <img> / Worker / inside-worker) to
   *      an asset CDN,
   *   2. wrapping cross-origin workers into same-origin blob workers,
   *   3. stubbing the offline service worker handshake when the real one
   *      (game-sw.js) is unavailable on the current origin.
   *
   * CDN resolution order:
   *   - window.CAR_SOCCER_CDN  (edit the line below for a permanent setting)
   *   - "?cdn=..." query parameter  (also remembered in localStorage)
   *   - localStorage "car-soccer:cdn"
   *   - empty string: assets served from the folder next to this index.html
   *     (works for local static servers and GitHub Pages)
   *
   * Example CDN value once this repo is on GitHub (repo must be public):
   *   https://cdn.jsdelivr.net/gh/<user>/car-soccer-web@main
   * ==========================================================================*/
  (function () {
    "use strict";

    // Boot diagnostics (visible via window.__bootlog in DevTools)
    try {
      window.__bootlog = [];
      window.addEventListener("error", function (e) {
        window.__bootlog.push("ERR " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno);
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        window.__bootlog.push("REJ " + (r && (r.stack || r.message) || String(r)).slice(0, 500));
      });
    } catch (e) {}

    // ----- configuration -----------------------------------------------------
    // Default asset source: the "car-soccer-assets" GitHub repo via jsDelivr.
    // 1. Push C:\Users\purpl\Downloads\car-soccer-assets to a PUBLIC GitHub repo
    // 2. Replace YOUR-USERNAME below (or open with ?cdn=<base-url> once - it sticks)
    var CDN = "https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/car-soccer-assets@main";
    try {
      if (window.CAR_SOCCER_CDN) CDN = String(window.CAR_SOCCER_CDN).trim();
      var qs = new URLSearchParams(location.search);
      var p = qs.get("cdn");
      if (p) {
        CDN = p.trim();
        try { localStorage.setItem("car-soccer:cdn", CDN); } catch (e) {}
      } else if (CDN.indexOf("YOUR-USERNAME") >= 0) {
        // Placeholder not replaced yet - use a saved value or local files instead.
        var saved0 = null;
        try { saved0 = localStorage.getItem("car-soccer:cdn"); } catch (e) {}
        CDN = saved0 ? saved0.trim() : "";
      } else if (!CDN) {
        var ls = null;
        try { ls = localStorage.getItem("car-soccer:cdn"); } catch (e) {}
        if (ls) CDN = ls.trim();
      }
    } catch (e) {}
    if (CDN) CDN = CDN.replace(/\/+$/, "");

    var locationDir = location.pathname.replace(/[^\/]*$/, "");
    // CDN mode: files sit at the repo root. Local mode: ./assets/ next to index.html.
    var PREFIX = CDN ? CDN + "/" : locationDir + "assets/";
    // Normalize once to a fully absolute URL: on file:// the pathname is
    // "/C:/..." and path-relative strings are unusable for fetch/XHR.
    try { PREFIX = new URL(PREFIX, location.href).href; } catch (e) {}
    var ABS_PREFIX = PREFIX;

    function rewrite(s) {
      if (typeof s !== "string") return s;
      // Scan for the "/assets/" marker FIRST: a URL that still contains it
      // (e.g. new URL("/assets/w.js", import.meta.url)) must be rewritten even
      // when it happens to start with the CDN prefix.
      var i = s.indexOf("/assets/");
      if (i >= 0) return PREFIX + s.slice(i + 8);
      if (s.indexOf(PREFIX) === 0) return s;
      if (s.indexOf("assets/") === 0) return PREFIX + s.slice(7);
      return s;
    }

    // ----- fetch patch ---------------------------------------------------------
    var realFetch = typeof window.fetch === "function" ? window.fetch.bind(window) : null;

    var MIME = {
      gltf: "model/gltf+json", glb: "model/gltf-binary", json: "application/json",
      png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp",
      ktx2: "image/ktx2", basis: "image/basis", bin: "application/octet-stream",
      wasm: "application/wasm", mp3: "audio/mpeg", ogg: "audio/ogg", wav: "audio/wav",
      webm: "audio/webm", m4a: "audio/mp4", css: "text/css", js: "text/javascript"
    };
    function guessMime(url) {
      var m = /\.([A-Za-z0-9]+)(?:\?|$)/.exec(url);
      return m ? (MIME[m[1].toLowerCase()] || "application/octet-stream") : "application/octet-stream";
    }

    // fetch() is unavailable for file: URLs; fall back to XHR (works with status 0).
    function xhrToResponse(url, init) {
      return new Promise(function (resolve, reject) {
        try {
          var x = new XMLHttpRequest();
          x.open((init && init.method) || "GET", url, true);
          if (init && init.headers) {
            try { for (var k in init.headers) x.setRequestHeader(k, init.headers[k]); } catch (e) {}
          }
          x.responseType = "arraybuffer";
          x.onload = function () {
            resolve(new Response(x.response, {
              status: x.status === 0 ? 200 : x.status,
              statusText: x.status === 0 ? "OK" : x.statusText,
              headers: { "Content-Type": guessMime(url) }
            }));
          };
          x.onerror = function () { reject(new TypeError("Failed to fetch " + url)); };
          x.onabort = function () { reject(new DOMException("Aborted", "AbortError")); };
          x.send(null);
        } catch (e) { reject(e); }
      });
    }

    function isFileUrl(s) { return typeof s === "string" && s.indexOf("file:") === 0; }

    function logFetch(u) {
      try { if (window.__bootlog && window.__bootlog.length < 400) window.__bootlog.push("FETCH " + u); } catch (e) {}
    }

    if (realFetch) {
      window.fetch = function (input, init) {
        try {
          var urlStr = null, reqObj = null;
          if (input && typeof input === "object" && typeof input.url === "string") { reqObj = input; urlStr = input.url; }
          else if (input instanceof URL) urlStr = input.href;
          else if (typeof input === "string") urlStr = input;
          if (urlStr != null) {
            logFetch(urlStr);
            var rurl = rewrite(urlStr);
            if (isFileUrl(rurl)) return xhrToResponse(rurl, reqObj || init);
            if (reqObj) return realFetch(new Request(rurl, reqObj), init);
            return realFetch(rurl, init);
          }
        } catch (e) {}
        return realFetch(input, init);
      };
    }

    // ----- <img> patch (three.js ImageLoader and `new Image`) -------------------
    if (typeof HTMLImageElement !== "undefined") {
      var imgSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
      var guard = function (el) {
        try {
          if (el instanceof HTMLImageElement && !el.__csPatched) {
            el.__csPatched = true;
            Object.defineProperty(el, "src", {
              get: function () { return imgSrc.get.call(el); },
              set: function (v) { imgSrc.set.call(el, rewrite(v)); },
              configurable: true, enumerable: true
            });
          }
        } catch (e) {}
        return el;
      };
      var rawCE = document.createElement.bind(document);
      document.createElement = function () {
        return guard(rawCE.apply(null, arguments));
      };
      if (document.createElementNS) {
        var rawCENS = document.createElementNS.bind(document);
        document.createElementNS = function () {
          return guard(rawCENS.apply(null, arguments));
        };
      }
      var rawSetAttr = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function (name, value) {
        try {
          if (this instanceof HTMLImageElement && String(name).toLowerCase() === "src")
            return rawSetAttr.call(this, name, rewrite(value));
        } catch (e) {}
        return rawSetAttr.call(this, name, value);
      };
      var RawImage = window.Image;
      window.Image = function (w, h) { return guard(new RawImage(w, h)); };
      window.Image.prototype = RawImage.prototype;
    }

    // ----- Worker wrapper (cross-origin / subpath-safe blob workers) ------------
    var RawWorker = window.Worker;
    window.Worker = function (url, opts) {
      var raw = (url && typeof url === "object" && "href" in url) ? url.href : String(url);
      var abs = rewrite(raw);
      var text = null;
      try {
        var x = new XMLHttpRequest();
        x.open("GET", abs, false); // sync: Worker constructors cannot await
        x.send(null);
        if (x.status >= 200 && x.status < 300 || x.status === 0) text = x.responseText;
      } catch (e) {}
      if (text == null) return new RawWorker(abs, opts);
      text = text.split('"/assets/').join('"' + ABS_PREFIX)
                 .split("'/assets/").join("'" + ABS_PREFIX)
                 .split("`/assets/").join("`" + ABS_PREFIX);
      var prelude =
        'var __PREFIX=' + JSON.stringify(ABS_PREFIX) + ';' +
        'var __rw=function(u){try{' +
        'if(typeof u==="string"){' +
        'var i=u.indexOf("/assets/");if(i>=0)return __PREFIX+u.slice(i+8);' +
        'if(u.indexOf(__PREFIX)===0)return u;' +
        'if(u.indexOf("assets/")===0)return __PREFIX+u.slice(7);' +
        '}else if(u&&typeof u.url==="string"){return __rw(u.url)}' +
        '}catch(e){}return u};' +
        'var __f=self.fetch?self.fetch.bind(self):null;' +
        'var __mime=function(u){var m=/\\.([A-Za-z0-9]+)(?:\\?|$)/.exec(u);return m&&({"gltf":"model/gltf+json","glb":"model/gltf-binary","json":"application/json","bin":"application/octet-stream","wasm":"application/wasm","onnx":"application/octet-stream"}[m[1].toLowerCase()])||"application/octet-stream"};' +
        'var __xhr=function(u,o){return new Promise(function(res,rej){try{var x=new XMLHttpRequest();x.open((o&&o.method)||"GET",u,true);x.responseType="arraybuffer";x.onload=function(){res(new Response(x.response,{status:x.status===0?200:x.status,headers:{"Content-Type":__mime(u)}}))};x.onerror=function(){rej(new TypeError("Failed to fetch "+u))};x.onabort=function(){rej(new DOMException("Aborted","AbortError"))};x.send(null)}catch(e){rej(e)}})};' +
        'if(__f){self.fetch=function(i,o){try{var s=(i&&typeof i.url==="string")?i.url:(typeof i==="string"?i:(i&&i.href)||null);' +
        'if(s!=null){var r2=__rw(s);if(r2.indexOf("file:")===0)return __xhr(r2,o);' +
        'if(i&&typeof i.url==="string")return __f(new Request(r2,i),o);return __f(r2,o)}}catch(e){}return __f(i,o)}}' +
        'var __xo=XMLHttpRequest.prototype.open;' +
        'XMLHttpRequest.prototype.open=function(){var a=Array.prototype.slice.call(arguments);' +
        'a[1]=__rw(a[1]);return __xo.apply(this,a)};';
      var blob = new Blob([prelude + text], { type: "application/javascript" });
      return new RawWorker(URL.createObjectURL(blob), opts);
    };
    window.Worker.prototype = RawWorker.prototype;

    // ----- service worker stubs (only when the real game-sw.js can't work) ------
    try {
      if (!window.isSecureContext)
        Object.defineProperty(window, "isSecureContext", { value: true, configurable: true });
    } catch (e) {}
    try {
      if (!("caches" in window)) {
        window.caches = {
          open: async function () {
            return {
              match: async function () { return undefined; },
              put: async function () {},
              keys: async function () { return []; },
              delete: async function () { return true; }
            };
          },
          has: async function () { return false; },
          keys: async function () { return []; },
          delete: async function () { return true; }
        };
      }
    } catch (e) {}
    if ("serviceWorker" in navigator) {
      var sw = navigator.serviceWorker;
      var realRegister = sw.register.bind(sw);
      var realGet = sw.getRegistration.bind(sw);
      var realReady = null;
      try { realReady = sw.ready; } catch (e) {}
      var fakeReg = null;
      var makeFake = function () {
        if (fakeReg) return fakeReg;
        var active = {
          scriptURL: location.protocol + "//" + location.host + "/game-sw.js",
          postMessage: function (msg, transfer) {
            var port = transfer && transfer[0];
            if (port) setTimeout(function () {
              try { port.postMessage({ kind: "offline-ready", completed: 0, total: 0 }); } catch (e) {}
            }, 0);
          }
        };
        fakeReg = {
          installing: null, waiting: null, active: active, scope: "/",
          update: function () { return Promise.resolve(); },
          unregister: function () { return Promise.resolve(true); },
          addEventListener: function () {}, removeEventListener: function () {}
        };
        return fakeReg;
      };
      sw.register = function (u, o) {
        return realRegister(u, o).catch(function () { return makeFake(); });
      };
      sw.getRegistration = function () {
        return realGet.apply(sw, arguments).catch(function () { return null; });
      };
      try {
        Object.defineProperty(sw, "ready", {
          configurable: true,
          get: function () {
            // On file:// the real ready promise never settles; resolve a fake
            // registration immediately instead of deferring to it.
            if (location.protocol === "file:") return Promise.resolve(makeFake());
            if (realReady && realReady.then) return realReady.catch(function () { return makeFake(); });
            return Promise.resolve(makeFake());
          }
        });
      } catch (e) {}
    }

    function boot() {
      var splash = document.getElementById("boot-splash");
      var splashMsg = document.getElementById("boot-msg");
      function fail(msg) {
        if (!splash) return;
        splash.classList.add("error");
        splashMsg.textContent = msg;
      }
      function hideSplash() {
        if (splash) { splash.classList.add("hide"); setTimeout(function () { splash.remove(); }, 500); }
      }

      var entryURL = PREFIX + "game-DskACDFO.js";
      var cssURL = PREFIX + "game-C5MKlKFb.css";

      // Probe so a missing local asset folder produces a clear message.
      if (location.protocol === "http:" || location.protocol === "https:") {
        try {
          var probe = new XMLHttpRequest();
          probe.open("HEAD", entryURL, false);
          probe.send(null);
          if (!(probe.status >= 200 && probe.status < 300) && !CDN) {
            fail("Game assets were not found next to index.html (" + entryURL + ").\n\n" +
                 "Serve this whole folder with any static server (e.g. \"npx serve\"),\n" +
                 "or add ?cdn=<asset-base-url> to the page URL.");
            return;
          }
        } catch (e) {}
      }

      // Rewrite the web manifest so its root-relative icon paths work here too.
      try {
        var mURL = new URL("site.webmanifest", location.href).href;
        var mx = new XMLHttpRequest();
        mx.open("GET", mURL, false);
        mx.send(null);
        if (mx.status >= 200 && mx.status < 300 || mx.status === 0) {
          var mText = mx.responseText.split("/assets/").join(ABS_PREFIX);
          var mLink = document.querySelector('link[rel="manifest"]');
          if (mLink) mLink.href = URL.createObjectURL(new Blob([mText], { type: "application/manifest+json" }));
        }
      } catch (e) {}

      // Inline the CSS with rewritten url() paths (a <link> would leave
      // root-relative url(/assets/...) unpatched, breaking on file:// and subpaths).
      try {
        var cx = new XMLHttpRequest();
        cx.open("GET", cssURL, false);
        cx.send(null);
        if (cx.status >= 200 && cx.status < 300 || cx.status === 0) {
          var cssText = cx.responseText.split("/assets/").join(ABS_PREFIX);
          var style = document.createElement("style");
          style.textContent = cssText;
          document.head.appendChild(style);
        } else {
          throw new Error("CSS " + cx.status);
        }
      } catch (e) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.crossOrigin = "anonymous";
        link.href = cssURL;
        document.head.appendChild(link);
      }

      var script = document.createElement("script");
      script.type = "module";
      script.crossOrigin = "anonymous";
      script.src = entryURL;
      script.onerror = function () {
        fail("Failed to load the game bundle from:\n" + entryURL +
             "\n\nIf using the default CDN: push the car-soccer-assets folder to a PUBLIC\n" +
             "GitHub repo, then replace YOUR-USERNAME in index.html (or open with\n" +
             "?cdn=https://cdn.jsdelivr.net/gh/<user>/car-soccer-assets@main once).\n" +
             "Check the URL is correct and the repo is public.");
      };
      script.addEventListener("load", hideSplash);
      document.body.appendChild(script);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="boot-splash">
    <div class="spinner"></div>
    <div class="msg" id="boot-msg">Loading Car Soccer...</div>
  </div>
</body>
</html>
